# The Japanese half of TESTING-CHECKS.md.
#
# `crates/fude/examples/make-testcheck.rs` reads this and TESTING.md, and
# writes TESTING-CHECKS.md from the two. TESTING.md owns the check ids, the
# section list and the English; this file owns nothing but the Japanese, so a
# row that leaves TESTING.md leaves the checklist whatever is written here,
# and a row that arrives shows up untranslated (〔未訳〕) rather than not at all.
#
# `[section."N"]` takes `title`, `setup` and `note`; `[row]` maps a check id to
# its Japanese. Bare keys go before the first `[table]`.
strict = true

[section."1"]
title = "起動"

[section."2"]
title = "書く"

[section."3"]
title = "上限"

[section."4"]
title = "清書"

[section."5"]
title = "ノートと本棚"
note = "ノートのフォルダーは既定で `ドキュメント\\fude\\<ノート名>\\`。"

[section."6"]
title = "お題と記録"

[section."7"]
title = "音"

[section."8"]
title = "設定"

[section."9"]
title = "キー・キー一覧・パレット"

[section."10"]
title = "書き出しと印刷"

[row]
"1.1" = "起動する → 1280x800 の窓が「fude」の題で開き、タスクバー（と Alt+Tab）に朱の枠と筆の一画のアイコン"
"1.2" = "窓を動かし大きさを変えて閉じ、また起動する → 同じ場所と大きさで開く"
"1.3" = "F12 → ブラウザーで不具合報告のフォームが開き、版と OS が入っている"
"1.4" = "`ドキュメント\\fude` がない状態で起動 → `ドキュメント\\fude\\ノート\\` ができ、何も聞かれずにすぐ打てる"

"2.1" = "IME で「きょうははれ」を打ち、変換して確定 → 変換中の字は帯の打つ所に出る。打つ所は動かず、字のほうが流れる"
"2.2" = "← を 2 回、X を打ち、Home と End → 1 字ずつ戻り、そこに X が入る。Home・End で端へ"
"2.3" = "「一。二、三」で Ctrl+← と Ctrl+→ → 句読点の後ろへ跳ぶ"
"2.4" = "最初の字の前で Enter、字のあとで Enter を 2 回 → 最初の字の前には段落を作らず、2 回でも段落の区切りは 1 つ（空の段落はできない）"
"2.5" = "タブと空の行 3 つを含む文を貼り付ける → タブは空白に、空の行は段落の区切り 1 つに"
"2.6" = "設定の「書く」で向きを縦に → 帯が縦になり、↑ ↓ で動く"
"2.7" = "マウスに触れずにしばらく打ち、マウスを動かす → 打っている間はタイトルバーが薄くなり、動かすと戻る"
"2.8" = "何字か打って窓を閉じ、また起動する → 打った字が戻り、入力点はその後ろ"
"2.9" = "設定の「このノート」で「消せないモード」をオンにし、Backspace・Delete・← → どれも効かず、打つのは続けられる"

"3.1" = "「このノート」で字数の上限を 10 にして 12 字打つ → 10 字目で帯が上限を知らせ、鈴が 1 回鳴る。画面は変わらず、11・12 字目も入る"
"3.2" = "時間の上限を 1 分、時計は最初の 1 字から。待ってから打つ → 最初の字までは時計が動かず、その 1 分後に帯が知らせる"
"3.3" = "上限を過ぎてから Esc、Enter → 続きを書ける。上限は「書く」ページのとおりに上がるか外れる"
"3.4" = "時間の上限を 1 分にして 1 字打ち、ほかの窓をクリックして待つ → 1 分たつと fude のアイコンのシステムの通知が上限を知らせる。fude が前にあるときは出ない"

"4.1" = "2 段落書いて Esc → 20×20 の原稿用紙・縦書き・明朝の清書。柱・魚尾・ページの番号"
"4.2" = "「PCー」を書き、道具の列で方眼・縦書き → 括弧と長音は縦の形、P と C は 1 マスに 1 字"
"4.3" = "「今」「「」「A」で始まる段落を書く → 字下げは「今」の段落だけ"
"4.4" = "行の頭に「。」が来るように書く → 前の行の最後のマスに入るか、「このノート」のとおりマスの外にぶら下がる。「。」」は 1 マス"
"4.5" = "`｜漢字《かんじ》` と `《《強調》》` → 「漢字」の横に小さくルビ、「強調」に傍点。記号は出ない"
"4.6" = "道具の列で紙・向き・マスを変える → そのたびにすぐ描き直す"
"4.7" = "Ctrl+C してメモ帳に貼る → 字下げした段落の頭は全角の空白。道具の列にコピーした字数"
"4.8" = "清書の字をクリック → 書く画面に戻り、入力点はその字"
"4.9" = "清書の上で字を打つ → 書く画面に戻り、その字が入力点に入る"
"4.10" = "速さを変えて数行書き、1 度 40 秒止まって Esc → 行の横に速さの線、止まった所に点。「書く」で消せる。コピーと書き出しには入らない"
"4.11" = "篇を 2 つ書き、清書で ← と → → 1 篇ずつめくる（縦書きでは ← が新しい篇）。端では帯がもうないと言う"

"5.1" = "篇を書いて Esc し、`ドキュメント\\fude\\ノート\\` を開く → 書き始めた時刻の `YYYY-MM-DD_HHMM.txt`（UTF-8・LF・1 段落 1 行）"
"5.2" = "Ctrl+N → 篇をファイルに綴じ、聞かずにすぐ新しい篇"
"5.3" = "Ctrl+O → 本棚。左にノート、右にそのノートの篇（新しい順、字数・時間・1 分の字数）"
"5.4" = "本棚で N、「日記」、Enter → `ドキュメント\\fude\\日記\\` ができ、そのノートが選ばれる"
"5.5" = "ノートを選んで F2、名前を変えて Enter → フォルダーの名前も変わる。`\\` を含む名前やもうある名前は理由とともに断る"
"5.6" = "篇を選んで Enter → その篇の清書が開く"
"5.7" = "自分の .txt をノートのフォルダーに置いて本棚を開く → 篇として並び、開ける"
"5.8" = "清書で Ctrl+S → すぐ篇のファイルに書く"

"6.1" = "「このノート」でお題を 3 つ足し「一覧から順に」、Ctrl+N を 3 回 → 新しい篇ごとに次のお題が入力点の上に薄く、打ち始めるとさらに薄く。お題はノートの `fude.toml` に"
"6.2" = "「くじ引き」、次に「出さない」にして新しい篇 → お題がくじで選ばれ、次は出ない"
"6.3" = "2 日続けて書き、本棚を開く → 上に今日の字数・続けた日数・1 分の字数（この 7 日）。清書の下に今日の字数と続けた日数"

"7.1" = "「書く」でタイプライターを選び、打つ・消す・Enter・矢印 → 字と消すたびに音、Enter は重い音、矢印は鳴らない。選んだときに 1 回鳴る"
"7.2" = "鉛筆を選んで速く打つ → 柔らかい音が 1 字ずつ。続けて打っても 1 つの音にまとまらない"
"7.3" = "音の大きさを 0 にして戻す → 鳴らなくなり、また鳴る"
"7.4" = "最後の音から 1 分おく → 音を出すのをやめる（音量ミキサーには閉じるまで fude が残るが、目盛りは動かない）"

"8.1" = "Ctrl+, → 一般・テーマ・書く・このノート・キー・通知・詳細・このアプリについて。ほかの uchmk のアプリと同じテーマと言語"
"8.2" = "「書く」で字の大きさ・打つ所・帯に出すものを変える → すぐ効き、`config.toml` に書く"
"8.3" = "「このノート」で紙と上限を変える → ノートの `fude.toml` の `[note]` に書き、ほかのノートは自分の値のまま"
"8.4" = "ほかの uchmk のアプリでテーマを変える → fude も起動し直さずに従う"
"8.5" = "「通知」で音を入れ、ほかの音を選ぶ → `config.toml` の `[notify]` に書く。「既定に戻す」で音は切れ、やわらかいチャイムに戻る"

"9.1" = "書く画面で F1、清書でも F1 → keymap のキー、書く・清書・本棚・固定のキーの順。清書の上で閉じると清書へ戻る"
"9.2" = "Ctrl+Shift+P で「設定」と打つ → 設定・書くのページ・このノートのページが並び、それぞれそのページを開く"
"9.3" = "`keymap.toml` に `on = \"<F2>\"`・`run = \"help\"` の `[[app.prepend_keymap]]` を書いて F2 → 起動し直さずにキー一覧が開く。書き間違いは通知に出る"
"9.4" = "Ctrl+=・Ctrl+-・Ctrl+0 → 大きく・小さく・元に戻る"
"9.5" = "Ctrl+Q → 篇をファイルに綴じてから閉じる"

"10.1" = "清書で Ctrl+E、Enter → ノートのフォルダーの `export\\<篇>.pdf` に書いてフォルダーを開く。A4・明朝で、画面の清書と同じ"
"10.2" = "パレットで「書き出し: PNG（ノート 1 冊）」、次に短くした篇を同じく → 篇ごとにページの PNG。前の長い篇の余ったページは残らない"
"10.3" = "Ctrl+P、Enter → 篇が印刷に回り、道具の列がそう言う。PDF を開くアプリに印刷を頼めない（Edge・Chrome）ときは、そのアプリで PDF が開き、道具の列が「そこから印刷して」と言う"
