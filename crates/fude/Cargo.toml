[package]
name = "fude"
description = "Text editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# `fude-com` (src/bin) is the console front for Windows, shipped as
# `fude.com`; plain `cargo run` still means the window.
default-run = "fude"

# The checklist generator and the bug form's writer; their own tests run with the rest.
[[example]]
name = "make-testcheck"
test = true

[[example]]
name = "make-bugform"
test = true

[build-dependencies]
ito-winres = { git = "https://github.com/uchmk/ito", rev = "6c4789603b3037568f5fe7a77c38b7fcc94292ed" }

[dependencies]
# Every ito crate at the same rev. scripts/ito-first.py says which crates an
# app must have and which it must not replace; what ito lacks, ask ito for.
ito-common = { git = "https://github.com/uchmk/ito", rev = "6c4789603b3037568f5fe7a77c38b7fcc94292ed", features = ["clock", "egui"] }
ito-i18n = { git = "https://github.com/uchmk/ito", rev = "6c4789603b3037568f5fe7a77c38b7fcc94292ed", features = ["edit"] }
ito-theme = { git = "https://github.com/uchmk/ito", rev = "6c4789603b3037568f5fe7a77c38b7fcc94292ed" }
# The settings screen: language / clock / theme pages, keys_page, notify_page, update_card.
ito-prefs = { git = "https://github.com/uchmk/ito", rev = "6c4789603b3037568f5fe7a77c38b7fcc94292ed" }
ito-keys = { git = "https://github.com/uchmk/ito", rev = "6c4789603b3037568f5fe7a77c38b7fcc94292ed", features = ["egui"] }
ito-keymap = { git = "https://github.com/uchmk/ito", rev = "6c4789603b3037568f5fe7a77c38b7fcc94292ed" }
# `--keys "<script>"`: the real window driven without a person.
ito-keyscript = { git = "https://github.com/uchmk/ito", rev = "6c4789603b3037568f5fe7a77c38b7fcc94292ed" }
# The IME at the band's input point: the preedit, the held commit, the candidate window.
ito-ime = { git = "https://github.com/uchmk/ito", rev = "6c4789603b3037568f5fe7a77c38b7fcc94292ed" }
# `?` / F1: the key help.
ito-help = { git = "https://github.com/uchmk/ito", rev = "6c4789603b3037568f5fe7a77c38b7fcc94292ed" }
# System notification, sound, webhook.
ito-notify = { git = "https://github.com/uchmk/ito", rev = "6c4789603b3037568f5fe7a77c38b7fcc94292ed" }
# F12: an issue form filled with the version, OS and what the app knows.
ito-bugreport = { git = "https://github.com/uchmk/ito", rev = "6c4789603b3037568f5fe7a77c38b7fcc94292ed" }
# The window's own title bar (drag, caption buttons, the palette box, the bell).
ito-titlebar = { git = "https://github.com/uchmk/ito", rev = "6c4789603b3037568f5fe7a77c38b7fcc94292ed" }
# The bottom bar: the screen, the counts, the keys, and the clock at its right end.
ito-statusbar = { git = "https://github.com/uchmk/ito", rev = "6c4789603b3037568f5fe7a77c38b7fcc94292ed" }
# The list the bell opens.
ito-notices = { git = "https://github.com/uchmk/ito", rev = "6c4789603b3037568f5fe7a77c38b7fcc94292ed" }
# Ctrl+Shift+P. Optional: drop it when the app has no commands to list.
ito-palette = { git = "https://github.com/uchmk/ito", rev = "6c4789603b3037568f5fe7a77c38b7fcc94292ed" }
# `fude.com` and the answers `out` and `err` write.
ito-console = { git = "https://github.com/uchmk/ito", rev = "6c4789603b3037568f5fe7a77c38b7fcc94292ed" }
# The settings' Advanced page opens the folders in the file manager.
ito-openin = { git = "https://github.com/uchmk/ito", rev = "6c4789603b3037568f5fe7a77c38b7fcc94292ed" }
# The clean copy out as PDF and PNG, and to the printer.
ito-export = { git = "https://github.com/uchmk/ito", rev = "6c4789603b3037568f5fe7a77c38b7fcc94292ed" }
# eframe's own defaults, but for `winit/default`: that draws the title on
# Wayland's window frame with ab_glyph, which brings the unmaintained ttf-parser.
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "links", "wayland", "web_screen_reader", "wgpu", "x11"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita-notitle"] }
egui = "0.36"
# The draft and config.toml, read into structs.
serde = { version = "1", features = ["derive"] }
toml = "1.1"
# A piece's file is named by the local time it was begun.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
# TESTING.md -> the lanes' check tables (examples/make-testcheck.rs).
ito-testcheck = { git = "https://github.com/uchmk/ito", rev = "6c4789603b3037568f5fe7a77c38b7fcc94292ed" }
