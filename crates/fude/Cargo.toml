[package]
name = "fude"
description = "Text editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# `fude-com` (src/bin) is the console front for Windows, shipped as
# `fude.com`; plain `cargo run` still means the window.
default-run = "fude"

# The checklist generator and the bug form's writer; their own tests run with the rest.
[[example]]
name = "make-testcheck"
test = true

[[example]]
name = "make-bugform"
test = true

[build-dependencies]
ito-winres = { git = "https://github.com/uchmk/ito", rev = "ba61f153ec714f3372f898052329999f9e626b24" }

[dependencies]
# Every ito crate at the same rev. scripts/ito-first.py says which crates an
# app must have and which it must not replace; what ito lacks, ask ito for.
ito-common = { git = "https://github.com/uchmk/ito", rev = "ba61f153ec714f3372f898052329999f9e626b24", features = ["clock", "egui"] }
ito-i18n = { git = "https://github.com/uchmk/ito", rev = "ba61f153ec714f3372f898052329999f9e626b24", features = ["edit"] }
ito-theme = { git = "https://github.com/uchmk/ito", rev = "ba61f153ec714f3372f898052329999f9e626b24" }
# The settings screen: language / clock / theme pages, keys_page, notify_page, update_card.
ito-prefs = { git = "https://github.com/uchmk/ito", rev = "ba61f153ec714f3372f898052329999f9e626b24" }
ito-keys = { git = "https://github.com/uchmk/ito", rev = "ba61f153ec714f3372f898052329999f9e626b24", features = ["egui"] }
ito-keymap = { git = "https://github.com/uchmk/ito", rev = "ba61f153ec714f3372f898052329999f9e626b24" }
# `--keys "<script>"`: the real window driven without a person.
ito-keyscript = { git = "https://github.com/uchmk/ito", rev = "ba61f153ec714f3372f898052329999f9e626b24" }
# `?` / F1: the key help.
ito-help = { git = "https://github.com/uchmk/ito", rev = "ba61f153ec714f3372f898052329999f9e626b24" }
# System notification, sound, webhook.
ito-notify = { git = "https://github.com/uchmk/ito", rev = "ba61f153ec714f3372f898052329999f9e626b24" }
# F12: an issue form filled with the version, OS and what the app knows.
ito-bugreport = { git = "https://github.com/uchmk/ito", rev = "ba61f153ec714f3372f898052329999f9e626b24" }
# The window's own title bar (drag, caption buttons, the palette box, the bell).
ito-titlebar = { git = "https://github.com/uchmk/ito", rev = "ba61f153ec714f3372f898052329999f9e626b24" }
# The list the bell opens.
ito-notices = { git = "https://github.com/uchmk/ito", rev = "ba61f153ec714f3372f898052329999f9e626b24" }
# Ctrl+Shift+P. Optional: drop it when the app has no commands to list.
ito-palette = { git = "https://github.com/uchmk/ito", rev = "ba61f153ec714f3372f898052329999f9e626b24" }
# `fude.com` and the answers `out` and `err` write.
ito-console = { git = "https://github.com/uchmk/ito", rev = "ba61f153ec714f3372f898052329999f9e626b24" }
# The settings' Advanced page opens the folders in the file manager.
ito-openin = { git = "https://github.com/uchmk/ito", rev = "ba61f153ec714f3372f898052329999f9e626b24" }
# eframe's own defaults, but for `winit/default`: that draws the title on
# Wayland's window frame with ab_glyph, which brings the unmaintained ttf-parser.
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "links", "wayland", "web_screen_reader", "wgpu", "x11"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita-notitle"] }
egui = "0.36"

[dev-dependencies]
# TESTING.md -> the lanes' check tables (examples/make-testcheck.rs).
ito-testcheck = { git = "https://github.com/uchmk/ito", rev = "ba61f153ec714f3372f898052329999f9e626b24" }
